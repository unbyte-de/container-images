---
name: Mirror Harbor images to GAR

# Copies Harbor releases from ghcr.io/goharbor into the GAR backup repository
# europe-west3-docker.pkg.dev/unbyte-devops/backup, which unbyte-mgt and stg-mgt pull Harbor from.
# Node containerd mirrors docker.io/ghcr.io/quay.io/... through the Harbor proxy cache, but not
# pkg.dev, so Harbor never has to pull its own images through itself.
#
# Harbor's config.yaml in unbyte-orbit-infra-services sets only the image repository; the tag is
# the chart's appVersion. So every Harbor chart bump (Renovate) needs that tag here first: this job
# copies every stable release from v2.15.0 on that is missing in GAR. Copies are multi-arch and
# keep the upstream digest.
#
# GCP setup (project unbyte-devops): service account with roles/artifactregistry.writer on the
# "backup" repository, impersonated through Workload Identity Federation by this repository.
# Repository variables: GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT.
on:
  schedule:
  - cron: "17 5 * * *" # 05:17 UTC daily
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only list what would be copied
        type: boolean
        default: false

permissions:
  contents: read
  packages: read
  id-token: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      SRC: ghcr.io/goharbor
      DST: europe-west3-docker.pkg.dev/unbyte-devops/backup
      # The images chart 1.19 (Harbor 2.15) deploys with our values (external DB, ingress, no nginx).
      IMAGES: harbor-core harbor-jobservice harbor-portal harbor-registryctl registry-photon trivy-adapter-photon harbor-exporter valkey-photon
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
    steps:
    # https://github.com/google-github-actions/auth
    - name: Authenticate to Google Cloud
      id: gcp
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
        token_format: access_token

    # https://github.com/imjasonh/setup-crane
    - name: Set up crane
      uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7

    - name: Copy missing Harbor releases
      env:
        GAR_TOKEN: ${{ steps.gcp.outputs.access_token }}
      run: |
        set -euo pipefail
        printf '%s' "${GAR_TOKEN}" | crane auth login "${DST%%/*}" -u oauth2accesstoken --password-stdin

        echo "### Harbor images copied to ${DST}" >> "${GITHUB_STEP_SUMMARY}"
        copied=0
        for img in ${IMAGES}; do
          # Stable releases from v2.15.0 on (no -rc/-dev tags).
          src_tags=$(crane ls "${SRC}/${img}" | grep -E '^v2[.](1[5-9]|[2-9][0-9])[.][0-9]+$' || true)
          # An image that was never copied has no repository in GAR yet.
          dst_tags=$(crane ls "${DST}/${img}" 2>/dev/null || true)
          for tag in ${src_tags}; do
            if grep -qxF "${tag}" <<<"${dst_tags}"; then
              continue
            fi
            if [ "${DRY_RUN}" = "true" ]; then
              echo "- [dry-run] ${img}:${tag}" | tee -a "${GITHUB_STEP_SUMMARY}"
              continue
            fi
            echo "::group::${img}:${tag}"
            crane copy "${SRC}/${img}:${tag}" "${DST}/${img}:${tag}"
            echo "::endgroup::"
            echo "- ${img}:${tag}" >> "${GITHUB_STEP_SUMMARY}"
            copied=$((copied + 1))
          done
        done
        echo "**Copied: ${copied}**" >> "${GITHUB_STEP_SUMMARY}"
